<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body {
    width: 260px;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0f1115;
    color: #e8e9ec;
    padding: 14px;
    margin: 0;
  }
  h1 { font-size: 14px; margin: 0 0 10px; }
  label { font-size: 12px; color: #8a8f9c; display: block; margin-bottom: 4px; }
  input {
    width: 100%;
    background: #0d0f13;
    border: 1px solid #2a2e38;
    color: #e8e9ec;
    padding: 8px;
    border-radius: 6px;
    font-size: 13px;
    box-sizing: border-box;
    margin-bottom: 10px;
  }
  button {
    width: 100%;
    background: #ff5c8a;
    color: #1a0510;
    border: none;
    padding: 8px;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
  }
  #saved { font-size: 12px; color: #8a8f9c; margin-top: 8px; text-align: center; min-height: 14px; }
</style>
</head>
<body>
  <h1>kpop_helper settings</h1>
  <label for="backendUrl">Backend URL</label>
  <input type="text" id="backendUrl" placeholder="http://127.0.0.1:8000" />
  <button id="saveBtn">Save</button>
  <div id="saved"></div>
  <script src="popup.js"></script>
</body>
</html>
