<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body {
    width: 260px;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0f1115;
    color: #e8e9ec;
    padding: 14px;
    margin: 0;
  }
  h1 { font-size: 14px; margin: 0 0 10px; }
  label { font-size: 12px; color: #8a8f9c; display: block; margin-bottom: 4px; }
  input {
    width: 100%;
    background: #0d0f13;
    border: 1px solid #2a2e38;
    color: #e8e9ec;
    padding: 8px;
    border-radius: 6px;
    font-size: 13px;
    box-sizing: border-box;
    margin-bottom: 10px;
  }
  button {
    width: 100%;
    background: #ff5c8a;
    color: #1a0510;
    border: none;
    padding: 8px;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
  }
  #saved { font-size: 12px; color: #8a8f9c; margin-top: 8px; text-align: center; min-height: 14px; }
  .checkbox-row { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #c7cad1; margin-bottom: 10px; }
  .checkbox-row input { width: auto; margin: 0; }
  .checkbox-row label { margin: 0; color: inherit; }
  .hint { font-size: 11px; color: #6a6f7c; margin: -6px 0 10px; }
</style>
</head>
<body>
  <h1>kpop_helper settings</h1>
  <label for="backendUrl">Backend URL</label>
  <input type="text" id="backendUrl" placeholder="http://127.0.0.1:8000" />

  <div class="checkbox-row">
    <input type="checkbox" id="forceStt" />
    <label for="forceStt">Force STT (ignore existing captions)</label>
  </div>
  <div class="checkbox-row">
    <input type="checkbox" id="skipTranslation" />
    <label for="skipTranslation">Skip translation (original-language subtitles)</label>
  </div>
  <p class="hint">Applied next time you click 翻譯 on a video.</p>

  <button id="saveBtn">Save</button>
  <div id="saved"></div>
  <script src="popup.js"></script>
</body>
</html>
