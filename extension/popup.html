<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
<style>
  * { box-sizing: border-box; }
  body {
    width: 280px;
    margin: 0;
    padding: 20px;
    background: #fff;
    color: #111;
    font-family: "Instrument Sans", "Segoe UI", "Microsoft JhengHei", sans-serif;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 2px solid #111;
    padding-bottom: 8px;
  }
  h1 { margin: 0; font: italic 400 24px/1 "Instrument Serif", Georgia, serif; }
  .lbl {
    font: 500 11px "IBM Plex Mono", ui-monospace, Consolas, monospace;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #555;
  }
  .field { display: flex; flex-direction: column; gap: 4px; }
  input[type="text"] {
    height: 40px;
    border: none;
    border-bottom: 1.5px solid #111;
    border-radius: 0;
    padding: 0 2px;
    background: transparent;
    color: #111;
    font: 400 13px "IBM Plex Mono", ui-monospace, Consolas, monospace;
  }
  .check { display: flex; align-items: center; gap: 10px; min-height: 36px; font-size: 14px; cursor: pointer; }
  .check input {
    appearance: none;
    -webkit-appearance: none;
    margin: 0;
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    border: 1.5px solid #111;
    display: grid;
    place-content: center;
    cursor: pointer;
  }
  .check input:checked { background: #111; }
  .check input:checked::after {
    content: "";
    width: 9px;
    height: 5px;
    border: solid #fff;
    border-width: 0 0 1.8px 1.8px;
    transform: translateY(-1px) rotate(-45deg);
  }
  .hint { margin: 0; font: italic 400 15px "Instrument Serif", Georgia, serif; color: #555; }
  button {
    height: 44px;
    border: 1.5px solid #111;
    background: #111;
    color: #fff;
    font: 600 14px "Instrument Sans", "Segoe UI", sans-serif;
    cursor: pointer;
  }
  button:hover { background: #333; }
  input:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid #111; outline-offset: 2px; }
  .foot { display: flex; justify-content: space-between; align-items: baseline; min-height: 16px; }
  #saved { font: 400 12px "IBM Plex Mono", ui-monospace, Consolas, monospace; color: #555; }
  a { font-size: 13px; color: #111; }
</style>
</head>
<body>
  <div class="head">
    <h1>Once Translator</h1>
    <span class="lbl">Settings</span>
  </div>

  <label class="field">
    <span class="lbl">Backend URL</span>
    <input type="text" id="backendUrl" placeholder="http://127.0.0.1:8000" />
  </label>

  <label class="check" title="Ignore existing captions, always transcribe"><input type="checkbox" id="forceStt" /> Force STT</label>
  <label class="check" title="Show original-language subtitles"><input type="checkbox" id="skipTranslation" /> Skip translation</label>
  <p class="hint">Applies next time you press 翻譯.</p>

  <button id="saveBtn">Save</button>
  <div class="foot">
    <span id="saved" role="status"></span>
    <a id="dashboardLink" href="http://127.0.0.1:8000" target="_blank" rel="noopener">Open dashboard ↗</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
