<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Once Translator</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@500;700&display=swap" />
<style>
  :root {
    --paper: #f7f5f0;
    --card: #ffffff;
    --ink: #111111;
    --muted: #555555;
    --rule: #999999;
    --accent: #d6331f;
    --serif: "Instrument Serif", Georgia, serif;
    --sans: "Instrument Sans", "Noto Sans TC", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
    --tc-serif: "Noto Serif TC", "PMingLiU", serif;
    --tc-sans: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
    --kh-font-size: 22px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); }
  a { color: var(--ink); }
  a:hover { color: var(--muted); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 36px 56px 64px; display: flex; flex-direction: column; gap: 32px; }

  /* ---------- Masthead ---------- */
  .masthead { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    border-bottom: 3px solid var(--ink); padding-bottom: 14px; }
  .brand { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  .wordmark { margin: 0; font: italic 400 44px/1 var(--serif); letter-spacing: -0.01em; }
  .mono { font: 400 13px var(--mono); color: var(--muted); }
  .lbl { font: 500 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  nav { display: flex; align-items: baseline; gap: 24px; font-size: 15px; font-weight: 500; }
  nav a { text-decoration: none; }
  nav a:first-child { text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 2px; }

  /* ---------- Layout ---------- */
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 48px; align-items: start; }
  .translate { display: flex; flex-direction: column; gap: 24px; min-width: 0; }

  .hero { display: flex; align-items: flex-start; gap: 20px; }
  .hero h1 { margin: 0; font: 400 clamp(40px, 5.4vw, 68px)/0.98 var(--serif); letter-spacing: -0.02em; }
  .sticker { margin-top: 10px; width: 92px; height: 92px; border-radius: 50%; flex-shrink: 0;
    background: var(--accent); color: var(--paper); display: flex; align-items: center; justify-content: center;
    text-align: center; font: 600 11px/1.25 var(--mono); letter-spacing: .06em; transform: rotate(12deg); }

  .url-bar { display: flex; border: 1.5px solid var(--ink); background: var(--card); }
  .url-bar input { flex: 1; min-width: 0; height: 60px; border: none; background: transparent; padding: 0 18px;
    font: 400 15px var(--mono); color: var(--ink); }
  .url-bar input:focus { outline: 2px solid var(--ink); outline-offset: -4px; }
  button { font-family: var(--sans); cursor: pointer; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  #loadBtn { height: 60px; padding: 0 30px; border: none; border-left: 1.5px solid var(--ink); background: var(--ink);
    color: var(--paper); font: italic 400 26px var(--serif); }
  #loadBtn:disabled { background: #444; color: #bbb; cursor: progress; }

  .options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 32px; align-items: end; }
  .check { display: flex; align-items: center; gap: 10px; min-height: 40px; font-size: 15px; cursor: pointer; }
  .check input { appearance: none; -webkit-appearance: none; margin: 0; width: 18px; height: 18px; flex-shrink: 0;
    border: 1.5px solid var(--ink); background: transparent; cursor: pointer; display: grid; place-content: center; }
  .check input:checked { background: var(--ink); }
  .check input:checked::after { content: ""; width: 9px; height: 5px; border: solid var(--paper); border-width: 0 0 1.8px 1.8px;
    transform: translateY(-1px) rotate(-45deg); }
  .field { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .field select { height: 44px; border: none; border-bottom: 1.5px solid var(--ink); background: transparent;
    padding: 0 2px; font: 500 15px var(--sans); color: var(--ink); border-radius: 0; }
  .field input[type="range"] { accent-color: var(--ink); height: 44px; }

  #status { font: 400 13px var(--mono); color: var(--muted); min-height: 18px; }
  #status:empty { display: none; }
  #status.error { color: var(--accent); }

  /* ---------- Player ---------- */
  .player-card { display: none; flex-direction: column; gap: 10px; margin: 0; }
  .player-card.visible { display: flex; }
  .player-shell { position: relative; width: 100%; aspect-ratio: 16 / 9; background: var(--ink); overflow: hidden; }
  #player { position: absolute; inset: 0; width: 100%; height: 100%; }
  #subtitleOverlay { position: absolute; left: 0; right: 0; bottom: 7%; text-align: center; pointer-events: none; padding: 0 5%; }
  #subtitleOverlay span { display: inline-block; background: var(--paper); color: var(--ink); padding: 4px 16px;
    font: 700 var(--kh-font-size, 22px)/1.4 var(--tc-sans); white-space: pre-wrap; }
  .caption { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--ink); padding-bottom: 10px; }
  #videoTitle { margin: 0; font: italic 400 20px var(--serif); min-width: 0; }
  #metaRow { margin-left: auto; display: flex; gap: 12px; align-items: baseline; }
  #downloadLink { color: var(--ink); }

  /* ---------- Glossary ---------- */
  .glossary { border: 1.5px solid var(--ink); background: var(--card); padding: 24px; display: flex; flex-direction: column;
    gap: 14px; box-shadow: 8px 8px 0 var(--ink); }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
  .glossary h2 { margin: 0; font: 400 36px var(--serif); }
  .note { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
  .glossary-list { list-style: none; margin: 0; padding: 0; max-height: 320px; overflow-y: auto; border-bottom: 1px solid var(--ink); }
  .glossary-list li { display: flex; align-items: baseline; gap: 8px; padding: 10px 0; border-top: 1px solid var(--ink); }
  .glossary-list .term { font-weight: 600; }
  .glossary-list .leader { flex: 1; min-width: 12px; border-bottom: 1px dotted var(--rule); }
  .glossary-list .translation { font: 600 16px var(--tc-serif); text-align: right; }
  .glossary-list .notes { display: block; font: 400 12px var(--sans); color: var(--muted); }
  .glossary-list .remove { align-self: center; width: 28px; height: 28px; border: none; background: none; color: var(--muted);
    font-size: 18px; line-height: 1; }
  .glossary-list .remove:hover { color: var(--ink); }
  .glossary-list li.empty { color: var(--muted); font-size: 13px; }
  .glossary-form { display: flex; flex-direction: column; gap: 4px; }
  .glossary-form input { height: 44px; border: none; border-bottom: 1.5px solid var(--ink); padding: 0 2px;
    font: 400 15px var(--sans); background: transparent; color: var(--ink); }
  #gAddBtn { margin-top: 10px; height: 46px; border: 1.5px solid var(--ink); background: var(--ink); color: var(--paper);
    font: 600 15px var(--sans); }

  /* ---------- Jobs log ---------- */
  .log-head { display: flex; align-items: baseline; gap: 16px; border-bottom: 3px solid var(--ink); padding-bottom: 8px; }
  .log-head h2 { margin: 0; font: 400 44px var(--serif); }
  .dash-table-wrap { overflow-x: auto; }
  table.dash-table { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.dash-table th { padding: 8px 10px; text-align: left; font: 500 11px var(--mono); letter-spacing: .06em;
    text-transform: uppercase; color: var(--muted); }
  table.dash-table td { padding: 14px 10px; border-top: 1px solid var(--ink); white-space: nowrap; vertical-align: top; }
  table.dash-table td.mono-cell { font: 400 13px var(--mono); color: var(--muted); }
  table.dash-table td.dash-name { max-width: 380px; overflow: hidden; text-overflow: ellipsis; }
  table.dash-table tr.is-running td.dash-name { font-weight: 600; }
  table.dash-table td.empty-note { color: var(--muted); }
  .dash-detail { margin-top: 4px; font: 400 12px var(--mono); color: var(--muted); white-space: normal; max-width: 260px; }
  .status-pill { display: inline-block; padding: 3px 8px; font: 500 11px var(--mono); letter-spacing: .06em;
    text-transform: uppercase; border: 1.5px solid var(--ink); }
  .status-pill.running { background: var(--accent); border-color: var(--accent); color: var(--paper); }
  .status-pill.error { border-style: dashed; text-decoration: line-through; }

  @media (max-width: 1100px) {
    .grid { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 960px) {
    .wrap { padding: 24px 16px 48px; }
    .wordmark { font-size: 34px; }
  }
  @media (max-width: 560px) {
    .options { grid-template-columns: minmax(0, 1fr); }
    .options .field { order: 1; }
    .options .spacer { display: none; }
    .sticker { display: none; }
    nav { gap: 16px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div class="brand">
      <p class="wordmark">Once Translator</p>
      <span class="mono">Zinobili Work · Vol. 01</span>
    </div>
    <nav>
      <a href="#translate">Translate</a>
      <a href="#jobs">Jobs</a>
      <a href="#glossary">Glossary</a>
      <span class="mono" id="backendHost"></span>
    </nav>
  </header>

  <div class="grid">
    <section class="translate" id="translate">
      <div class="hero">
        <h1>Twice in the video,<br>translation in <em>Once</em></h1>
        <div class="sticker" aria-hidden="true">ONE<br>IN A<br>MILLION</div>
      </div>

      <div class="url-bar">
        <label for="urlInput" class="sr-only">YouTube URL</label>
        <input type="text" id="urlInput" placeholder="https://www.youtube.com/watch?v=…" />
        <button id="loadBtn">Load →</button>
      </div>

      <div class="options">
        <label class="check" title="Ignore the cache and process the video again"><input type="checkbox" id="forceRefresh" /> Force re-process</label>
        <label class="field">
          <span class="lbl">Caption source</span>
          <select id="captionLangSelect">
            <option value="">Auto — Korean, then English</option>
            <option value="ko">Korean</option>
            <option value="en">English</option>
          </select>
        </label>
        <label class="check" title="Ignore existing captions, always transcribe with Whisper"><input type="checkbox" id="forceStt" /> Force STT</label>
        <label class="field">
          <span class="lbl">Translator</span>
          <select id="providerSelect">
            <option value="">Auto (.env default)</option>
            <option value="gemini">Gemini</option>
            <option value="anthropic">Anthropic</option>
            <option value="deepseek">DeepSeek</option>
            <option value="local">Local (Ollama / LM Studio)</option>
            <option value="claude_agent">Claude Code</option>
          </select>
        </label>
        <label class="check" title="Show the original-language transcript, no LLM call"><input type="checkbox" id="skipTranslation" /> Skip translation</label>
        <label class="field">
          <span class="lbl">Subtitle size — <span id="fontSizeLabel">22px</span></span>
          <input type="range" id="fontSizeSlider" min="14" max="44" step="1" value="22" />
        </label>
        <div class="spacer"></div>
        <label class="field" id="llmModelRow" style="display:none">
          <span class="lbl">Local LLM model</span>
          <select id="llmModelSelect"></select>
        </label>
      </div>

      <div id="status" role="status"></div>

      <figure class="player-card" id="playerShell">
        <div class="player-shell">
          <div id="player"></div>
          <div id="subtitleOverlay"></div>
        </div>
        <figcaption class="caption">
          <p id="videoTitle" style="display:none"></p>
          <span id="metaRow" style="display:none">
            <span class="mono" id="sourceBadge"></span>
            <a class="mono" id="downloadLink" href="#" download>.srt ↓</a>
          </span>
        </figcaption>
      </figure>
    </section>

    <aside class="glossary" id="glossary">
      <div class="section-head">
        <h2>Glossary</h2>
        <span class="mono" id="glossaryCount"></span>
      </div>
      <p class="note">Idol names, group names and fandom slang — kept consistent across every video.</p>
      <ul class="glossary-list" id="glossaryList"></ul>
      <div class="glossary-form">
        <input type="text" id="gTerm" aria-label="Term" placeholder="Term (KO / EN)" />
        <input type="text" id="gTranslation" aria-label="Traditional Chinese" placeholder="繁體中文" />
        <input type="text" id="gNotes" aria-label="Notes" placeholder="Notes (optional)" />
        <button id="gAddBtn">Add to glossary</button>
      </div>
    </aside>
  </div>

  <section id="jobs">
    <div class="log-head">
      <h2>The Log</h2>
      <span class="mono" id="dashCount"></span>
    </div>
    <div class="dash-table-wrap">
      <table class="dash-table">
        <thead>
          <tr>
            <th>No.</th>
            <th>Name</th>
            <th>Status</th>
            <th>Approach</th>
            <th>Transcription</th>
            <th>Translated</th>
            <th>Model</th>
          </tr>
        </thead>
        <tbody id="dashboardBody"></tbody>
      </table>
    </div>
  </section>
</div>

<script>
const API = "";

// ---------- Process a video ----------
const urlInput = document.getElementById("urlInput");
const loadBtn = document.getElementById("loadBtn");
const forceRefresh = document.getElementById("forceRefresh");
const forceStt = document.getElementById("forceStt");
const skipTranslation = document.getElementById("skipTranslation");
const captionLangSelect = document.getElementById("captionLangSelect");
const providerSelect = document.getElementById("providerSelect");
const llmModelRow = document.getElementById("llmModelRow");
const llmModelSelect = document.getElementById("llmModelSelect");
const statusEl = document.getElementById("status");
const videoTitleEl = document.getElementById("videoTitle");
const playerShell = document.getElementById("playerShell");
const metaRow = document.getElementById("metaRow");
const sourceBadge = document.getElementById("sourceBadge");
const downloadLink = document.getElementById("downloadLink");
const subtitleOverlay = document.getElementById("subtitleOverlay");

const STAGE_LABELS = {
  queued: "Queued...",
  looking_up_video: "Looking up video...",
  fetching_captions: "Fetching captions...",
  transcribing_audio: "Transcribing audio locally (this can take a few minutes)...",
  translating: "Translating to Traditional Chinese...",
  skipping_translation: "Skipping translation (showing original-language transcript)...",
  done: "Done.",
};

let cues = [];
let pollTimer = null;

function setStatus(text, isError) {
  statusEl.textContent = text || "";
  statusEl.classList.toggle("error", !!isError);
}

async function startProcessing() {
  const url = urlInput.value.trim();
  if (!url) return;
  loadBtn.disabled = true;
  playerShell.classList.remove("visible");
  metaRow.style.display = "none";
  videoTitleEl.style.display = "none";
  setStatus("Submitting...");

  try {
    const resp = await fetch(`${API}/process`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        url,
        force_refresh: forceRefresh.checked,
        force_stt: forceStt.checked,
        skip_translation: skipTranslation.checked,
        caption_lang: captionLangSelect.value || null,
        translation_provider: providerSelect.value || null,
        llm_model: llmModelRow.style.display !== "none" ? (llmModelSelect.value || null) : null,
      }),
    });
    if (!resp.ok) throw new Error((await resp.json()).detail || resp.statusText);
    const { job_id } = await resp.json();
    pollJob(job_id);
  } catch (err) {
    setStatus(`Error: ${err.message}`, true);
    loadBtn.disabled = false;
  }
}

function pollJob(jobId) {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    try {
      const resp = await fetch(`${API}/jobs/${jobId}`);
      if (!resp.ok) throw new Error("Job not found.");
      const job = await resp.json();

      if (job.status === "running") {
        const label = STAGE_LABELS[job.stage] || "Processing...";
        setStatus(job.detail ? `${label} (${job.detail})` : label);
      } else if (job.status === "done") {
        clearInterval(pollTimer);
        setStatus(job.result.cached ? "Loaded from cache." : "Done.");
        loadBtn.disabled = false;
        showResult(job.result);
      } else if (job.status === "error") {
        clearInterval(pollTimer);
        setStatus(`Error: ${job.error}`, true);
        loadBtn.disabled = false;
      }
    } catch (err) {
      clearInterval(pollTimer);
      setStatus(`Error: ${err.message}`, true);
      loadBtn.disabled = false;
    }
  }, 1500);
}

function showResult(result) {
  cues = result.cues.map(c => ({ start: c.start, end: c.end, text: c.text_zh }));
  videoTitleEl.textContent = result.title;
  videoTitleEl.style.display = "block";
  sourceBadge.textContent = `source: ${result.source_lang} (${result.source_type})`
    + (result.translated ? "" : " - untranslated");
  downloadLink.href = result.variant_id
    ? `${API}/subtitles/variant/${result.variant_id}.srt`
    : `${API}/subtitles/${result.video_id}.srt`;
  downloadLink.setAttribute("download", `${result.video_id}.srt`);
  metaRow.style.display = "flex";
  playerShell.classList.add("visible");
  loadYouTubePlayer(result.video_id);
}

// ---------- YouTube player + subtitle overlay ----------
let ytApiReady = false;
let player = null;
let pendingVideoId = null;
let syncTimer = null;

function onYouTubeIframeAPIReady() {
  ytApiReady = true;
  if (pendingVideoId) createPlayer(pendingVideoId);
}
window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

(function loadYTScript() {
  const tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);
})();

function loadYouTubePlayer(videoId) {
  if (!ytApiReady) {
    pendingVideoId = videoId;
    return;
  }
  createPlayer(videoId);
}

function createPlayer(videoId) {
  if (player) {
    player.loadVideoById(videoId);
    return;
  }
  player = new YT.Player("player", {
    videoId,
    playerVars: { rel: 0, cc_load_policy: 0 },
    events: {
      onReady: () => {
        if (!syncTimer) syncTimer = setInterval(syncSubtitle, 200);
      },
    },
  });
}

function findCue(t) {
  // cues are sorted by start; linear scan is fine at this size (a few hundred lines)
  for (let i = 0; i < cues.length; i++) {
    if (t >= cues[i].start && t < cues[i].end) return cues[i];
  }
  return null;
}

function syncSubtitle() {
  if (!player || typeof player.getCurrentTime !== "function") return;
  const t = player.getCurrentTime();
  const cue = findCue(t);
  subtitleOverlay.innerHTML = cue ? `<span>${escapeHtml(cue.text)}</span>` : "";
}

function escapeHtml(s) {
  const div = document.createElement("div");
  div.textContent = s;
  return div.innerHTML;
}

loadBtn.addEventListener("click", startProcessing);
urlInput.addEventListener("keydown", e => { if (e.key === "Enter") startProcessing(); });

// ---------- Translation provider + local LLM model dropdowns ----------
// The model dropdown is only relevant once "Local" is the *effective* provider (picked
// explicitly, or it's the .env default and nothing was picked) - the model isn't fixed via
// env var there, it's whatever the local server currently has loaded.
let localModels = [];
let defaultProvider = "";

function updateLlmModelRowVisibility() {
  const effectiveProvider = providerSelect.value || defaultProvider;
  llmModelRow.style.display = effectiveProvider === "local" && localModels.length > 0 ? "flex" : "none";
}

async function loadLocalModels() {
  try {
    const resp = await fetch(`${API}/local-models`);
    if (!resp.ok) return;
    const data = await resp.json();
    defaultProvider = data.default_provider || "";
    localModels = data.models || [];

    const autoOption = providerSelect.querySelector('option[value=""]');
    if (autoOption && defaultProvider) autoOption.textContent = `Auto (.env default: ${defaultProvider})`;

    llmModelSelect.innerHTML = "";
    for (const m of localModels) {
      const opt = document.createElement("option");
      opt.value = m;
      opt.textContent = m;
      llmModelSelect.appendChild(opt);
    }
    updateLlmModelRowVisibility();
  } catch (_e) {
    // local endpoint not reachable - leave the dropdown hidden
  }
}

providerSelect.addEventListener("change", updateLlmModelRowVisibility);
loadLocalModels();

// ---------- Subtitle font size ----------
const FONT_SIZE_KEY = "kh_font_size";
const fontSizeSlider = document.getElementById("fontSizeSlider");
const fontSizeLabel = document.getElementById("fontSizeLabel");

function applyFontSize(px) {
  document.documentElement.style.setProperty("--kh-font-size", `${px}px`);
  fontSizeLabel.textContent = `${px}px`;
}

function loadFontSize() {
  let px = 22;
  try {
    const saved = parseInt(localStorage.getItem(FONT_SIZE_KEY), 10);
    if (Number.isFinite(saved)) px = saved;
  } catch (_e) {
    // localStorage unavailable - fall back to the default silently
  }
  fontSizeSlider.value = px;
  applyFontSize(px);
}

fontSizeSlider.addEventListener("input", () => {
  const px = parseInt(fontSizeSlider.value, 10);
  applyFontSize(px);
  try {
    localStorage.setItem(FONT_SIZE_KEY, String(px));
  } catch (_e) {
    // best-effort persistence only
  }
});

loadFontSize();

// ---------- Glossary ----------
const glossaryList = document.getElementById("glossaryList");
const gTerm = document.getElementById("gTerm");
const gTranslation = document.getElementById("gTranslation");
const gNotes = document.getElementById("gNotes");
const gAddBtn = document.getElementById("gAddBtn");
const glossaryCount = document.getElementById("glossaryCount");

async function loadGlossary() {
  const resp = await fetch(`${API}/glossary`);
  const entries = await resp.json();
  glossaryList.innerHTML = "";
  glossaryCount.textContent = `No. ${entries.length}`;
  if (entries.length === 0) {
    glossaryList.innerHTML = '<li class="empty">No glossary entries yet.</li>';
    return;
  }
  for (const e of entries) {
    const li = document.createElement("li");
    li.innerHTML = `<span class="term">${escapeHtml(e.term)}${e.notes ? `<span class="notes">${escapeHtml(e.notes)}</span>` : ""}</span>`
      + `<span class="leader"></span><span class="translation">${escapeHtml(e.translation)}</span>`;
    const delBtn = document.createElement("button");
    delBtn.className = "remove";
    delBtn.textContent = "×";
    delBtn.setAttribute("aria-label", `Remove ${e.term}`);
    delBtn.title = "Remove";
    delBtn.onclick = async () => {
      await fetch(`${API}/glossary/${encodeURIComponent(e.term)}`, { method: "DELETE" });
      loadGlossary();
    };
    li.appendChild(delBtn);
    glossaryList.appendChild(li);
  }
}

gAddBtn.addEventListener("click", async () => {
  const term = gTerm.value.trim();
  const translation = gTranslation.value.trim();
  if (!term || !translation) return;
  await fetch(`${API}/glossary`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ term, translation, notes: gNotes.value.trim() }),
  });
  gTerm.value = ""; gTranslation.value = ""; gNotes.value = "";
  loadGlossary();
});

loadGlossary();

// ---------- Dashboard ----------
const dashboardBody = document.getElementById("dashboardBody");
const dashCount = document.getElementById("dashCount");
document.getElementById("backendHost").textContent = location.host;

function formatTranscription(sourceLang, sourceType) {
  if (!sourceType) return "-";
  if (sourceType === "whisper") return `whisper (${sourceLang})`;
  return `${sourceType} captions (${sourceLang})`;
}

function formatTranslation(translated) {
  if (translated === true) return "yes";
  if (translated === false) return "no";
  return "-";
}

function statusPill(status) {
  const known = status === "running" || status === "done" || status === "error";
  const cls = known ? status : "done";
  return `<span class="status-pill ${cls}">${escapeHtml(status)}</span>`;
}

// Normalizes a running/errored job or a fully processed (cached) video into one row shape.
function jobToRow(j) {
  const label = STAGE_LABELS[j.stage] || j.stage || "Processing...";
  return {
    name: j.title || j.url,
    status: j.status,
    statusDetail: j.status === "running" ? (j.detail ? `${label} (${j.detail})` : label) : (j.error || ""),
    approach: j.translation_provider || "-",
    used_transcription: formatTranscription(j.source_lang, j.source_type),
    used_translation: formatTranslation(j.translated),
    model_used: j.translation_model || "-",
  };
}

function processedToRow(item) {
  return {
    name: item.title || item.video_id,
    status: "done",
    statusDetail: "",
    approach: item.translation_provider || "-",
    used_transcription: formatTranscription(item.source_lang, item.source_type),
    used_translation: formatTranslation(item.translated),
    model_used: item.translation_model || "-",
  };
}

function renderDashboard(allJobs, processed) {
  // Only unfinished/errored jobs come from the jobs list - once a job finishes it's also
  // reflected in `processed` (from the shared cache), so pulling both would double it up.
  const rows = [
    ...allJobs.filter(j => j.status === "running" || j.status === "error").map(jobToRow),
    ...processed.map(processedToRow),
  ];

  const running = rows.filter(r => r.status === "running").length;
  const done = rows.filter(r => r.status === "done").length;
  const errored = rows.filter(r => r.status === "error").length;
  dashCount.textContent = [
    running ? `${running} running` : "",
    `${done} done`,
    errored ? `${errored} failed` : "",
  ].filter(Boolean).join(" · ");

  dashboardBody.innerHTML = "";
  if (rows.length === 0) {
    dashboardBody.innerHTML = '<tr><td colspan="7" class="empty-note">No videos processed yet.</td></tr>';
    return;
  }
  rows.forEach((row, i) => {
    const tr = document.createElement("tr");
    if (row.status === "running") tr.className = "is-running";
    // Numbered newest-first, like issues of a zine: the top row gets the highest number.
    const no = String(rows.length - i).padStart(2, "0");
    tr.innerHTML = `
      <td class="mono-cell">${no}</td>
      <td class="dash-name" title="${escapeHtml(row.name)}">${escapeHtml(row.name)}</td>
      <td>${statusPill(row.status)}${row.statusDetail ? `<div class="dash-detail">${escapeHtml(row.statusDetail)}</div>` : ""}</td>
      <td class="mono-cell">${escapeHtml(row.approach)}</td>
      <td class="mono-cell">${escapeHtml(row.used_transcription)}</td>
      <td class="mono-cell">${escapeHtml(row.used_translation)}</td>
      <td class="mono-cell">${escapeHtml(row.model_used)}</td>`;
    dashboardBody.appendChild(tr);
  });
}

async function refreshDashboard() {
  try {
    const resp = await fetch(`${API}/dashboard`);
    if (!resp.ok) return;
    const data = await resp.json();
    renderDashboard(data.jobs || [], data.processed || []);
  } catch (_e) {
    // best-effort - just try again on the next tick
  }
}

refreshDashboard();
setInterval(refreshDashboard, 2000);
</script>
